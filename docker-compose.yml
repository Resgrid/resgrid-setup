# Resgrid single-server stack. Configure with ./setup.sh, then:
#   docker compose up -d
# Optional add-ons: --profile tracking (GPS tracker gateway), --profile relay
# (inbound email dispatch).
name: resgrid

x-resgrid-app: &resgrid-app
  env_file: [.env]
  restart: unless-stopped
  networks: [rgmain]
  # Server-side calls to the public URLs (web BFF -> API token endpoint,
  # events -> API, MCP -> API) go straight to Caddy instead of out through
  # the router, so LAN installs work without hairpin NAT or internal DNS.
  extra_hosts:
    - "${RESGRID_WEB_HOST}:172.16.193.60"
    - "${RESGRID_API_HOST}:172.16.193.60"
    - "${RESGRID_EVENTS_HOST}:172.16.193.60"
  volumes:
    # Public certificate of Resgrid's local CA (see SSL_CERT_DIR in .env).
    - ./certs/ca:/usr/local/share/resgrid-ca:ro
  # Local copy of the search index (feature "search"), owned by the
  # images' non-root user.
  tmpfs:
    - /data/search:uid=65532,gid=65532,mode=0700
  depends_on: &resgrid-deps
    db-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  web:
    <<: *resgrid-app
    image: "resgridllc/resgridwebcore:latest"
    ports:
      - "5151:8080"

  api:
    <<: *resgrid-app
    image: "resgridllc/resgridwebservices:latest"
    ports:
      - "5152:8080"

  events:
    <<: *resgrid-app
    image: "resgridllc/resgridwebevents:latest"
    ports:
      - "5153:8080"

  worker:
    # Runs background jobs and creates/migrates the database schema at startup
    # (RESGRID__DODBUPGRADE=true). First start takes several minutes.
    <<: *resgrid-app
    image: "resgridllc/resgridworkersconsole:latest"

  tts:
    <<: *resgrid-app
    image: "resgridllc/resgridwebtts:latest"
    ports:
      - "5154:8080"
    depends_on:
      <<: *resgrid-deps
      rustfs-init:
        condition: service_completed_successfully

  mcp:
    # The MCP HTTP endpoint is unauthenticated (users log in inside the
    # protocol). Keep port 5155 on your LAN/VPN.
    <<: *resgrid-app
    image: "resgridllc/resgridwebmcp:latest"
    ports:
      - "5155:8080"

  tracker-gateway:
    # Requires the RESGRID__UnitTrackingConfig__* settings in .env.
    <<: *resgrid-app
    profiles: ["tracking"]
    image: "resgridllc/resgridtrackergateway:latest"
    ports:
      - "5004:5004/tcp"   # Queclink
      - "5004:5004/udp"
      - "5023:5023/tcp"   # GT06
      - "5023:5023/udp"
      - "5027:5027/tcp"   # Teltonika
      - "5027:5027/udp"

  relay:
    # Requires the RESGRID__RELAY__* settings in .env.
    <<: *resgrid-app
    profiles: ["relay"]
    image: "resgridllc/resgridrelay:latest"
    ports:
      - "25:2525"
    volumes:
      - ./certs/ca:/usr/local/share/resgrid-ca:ro
      # Dedupe store, saved .eml files and token cache.
      - relay-data:/app/publish/data
    depends_on:
      - api

  tileserver:
    # Optional offline map tiles (profile "maps"). Import a region first, see
    # README.md "Offline maps". Caddy serves the tiles at
    # https://<web host>/tiles/{z}/{x}/{y}.png.
    profiles: ["maps"]
    image: "overv/openstreetmap-tile-server:latest"
    restart: unless-stopped
    command: ["run"]
    shm_size: 192m
    environment:
      THREADS: "4"
    volumes:
      - osm-data:/data/database
      - osm-tiles:/data/tiles
    networks: [rgmain]

  clamav:
    # Virus scanning of uploaded files (profile "clamav", feature "scanning").
    # Ships with virus signatures and updates them while online.
    profiles: ["clamav"]
    image: "clamav/clamav-debian:stable"
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [rgmain]

  db:
    image: "dhi.io/postgres:18-alpine3.22"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Remove this mapping if nothing outside the stack needs PostgreSQL.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [rgmain]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    # One-shot: creates the four Resgrid databases if they don't exist.
    image: "dhi.io/postgres:18-alpine3.22"
    restart: "no"
    entrypoint: ["sh", "/scripts/create-databases.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/create-databases.sh:/scripts/create-databases.sh:ro
    networks: [rgmain]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: "dhi.io/redis:8-alpine3.23"
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [rgmain]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: "dhi.io/rabbitmq:4.3.0-debian13"
    # Fixed hostname: RabbitMQ stores its data under the node name.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Management UI, http://127.0.0.1:5160 (the image ships it disabled;
      # rabbitmq/enabled_plugins turns it on). rabbitmq/rabbitmq.conf permits
      # the transient queues Resgrid uses.
      - "127.0.0.1:5160:15672"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [rgmain]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 30

  rustfs:
    # S3-compatible object storage for TTS audio, imports and other buckets.
    image: "rustfs/rustfs:latest"
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    networks: [rgmain]
    # Uncomment to reach the S3 API from the host:
    #ports:
    #  - "127.0.0.1:5156:9000"

  rustfs-init:
    # One-shot: waits for RustFS, then creates the buckets named in .env.
    image: "rclone/rclone:1"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        n=0
        until rclone mkdir rustfs:resgrid-tts; do
          n=$$((n+1)); [ "$$n" -ge 90 ] && echo "RustFS did not come up" && exit 1
          echo "waiting for rustfs..."; sleep 2
        done
        rclone mkdir rustfs:resgrid-imports
        rclone mkdir rustfs:resgrid-search
        echo "Buckets ready."
    environment:
      RCLONE_CONFIG: /tmp/rclone.conf
      RCLONE_CONFIG_RUSTFS_TYPE: s3
      RCLONE_CONFIG_RUSTFS_PROVIDER: Other
      RCLONE_CONFIG_RUSTFS_ENDPOINT: http://rustfs:9000
      RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      RCLONE_CONFIG_RUSTFS_FORCE_PATH_STYLE: "true"
    networks: [rgmain]
    depends_on:
      - rustfs

  caddy-init:
    # One-shot: copies the local CA private key into Caddy's volume, readable
    # only by Caddy's non-root user.
    image: "rclone/rclone:1"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/private/resgrid-root-ca.key ]; then
          cp /certs/private/resgrid-root-ca.key /caddy-ca/resgrid-root-ca.key
          chown 65532:65532 /caddy-ca/resgrid-root-ca.key
          chmod 600 /caddy-ca/resgrid-root-ca.key
        fi
    volumes:
      - ./certs:/certs:ro
      - caddy-ca:/caddy-ca
    network_mode: none

  caddy:
    image: "dhi.io/caddy:2.11.3-debian13"
    restart: unless-stopped
    environment:
      RESGRID_WEB_HOST: ${RESGRID_WEB_HOST}
      RESGRID_API_HOST: ${RESGRID_API_HOST}
      RESGRID_EVENTS_HOST: ${RESGRID_EVENTS_HOST}
      RESGRID_TLS: ${RESGRID_TLS}
      RESGRID_HTTP_PORT: ${RESGRID_HTTP_PORT:-80}
      RESGRID_HTTPS_PORT: ${RESGRID_HTTPS_PORT:-443}
    ports:
      # Caddy listens on the same ports inside the container, so the public
      # URLs (with a port, if not 443) also work from the other containers.
      - "${RESGRID_HTTP_PORT:-80}:${RESGRID_HTTP_PORT:-80}"
      - "${RESGRID_HTTPS_PORT:-443}:${RESGRID_HTTPS_PORT:-443}"
      - "${RESGRID_HTTPS_PORT:-443}:${RESGRID_HTTPS_PORT:-443}/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/ca:/certs/ca:ro
      - ./certs/site:/certs/site:ro
      - caddy-ca:/certs/private:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      rgmain:
        ipv4_address: 172.16.193.60
    depends_on:
      caddy-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  rustfs-data:
  caddy-ca:
  caddy-data:
  caddy-config:
  relay-data:
  osm-data:
  osm-tiles:
  clamav-db:

networks:
  rgmain:
    ipam:
      config:
        - subnet: 172.16.193.0/24
