apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: web
          image: resgridllc/resgridwebcore:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: resgrid-env
          env:
            - name: WAIT_HOSTS
              value: postgres:5432,redis:6379,rabbitmq:5672,api:80
            - name: WAIT_TIMEOUT
              value: "300"
          ports:
            - name: http
              containerPort: 80
---
