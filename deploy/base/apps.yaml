# Resgrid application services. All images run as a non-root user and listen
# on 8080. Every pod mounts the public certificate of the Resgrid local CA
# (ConfigMap resgrid-ca) and trusts it through SSL_CERT_DIR in resgrid-env, so
# server-side calls to the public HTTPS URLs work with a private certificate.
# Pods labelled resgrid.io/tier=app also receive the generated patches in
# deploy/kustomization.yaml (host aliases, node selector).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    resgrid.io/tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: resgridllc/resgridwebcore:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          env:
            - {name: WAIT_HOSTS, value: "db:5432,redis:6379,rabbitmq:5672"}
            - {name: WAIT_TIMEOUT, value: "600"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /Health/GetCurrent, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
            # Scratch space of the search index (the index itself lives in RustFS).
            - {name: search, mountPath: /data/search}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
        - name: search
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    resgrid.io/tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: resgridllc/resgridwebservices:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          env:
            - {name: WAIT_HOSTS, value: "db:5432,redis:6379,rabbitmq:5672"}
            - {name: WAIT_TIMEOUT, value: "600"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
            # Scratch space of the search index (the index itself lives in RustFS).
            - {name: search, mountPath: /data/search}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
        - name: search
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: events
spec:
  selector:
    app: events
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  labels:
    resgrid.io/tier: app
spec:
  # SignalR uses the Redis backplane, but clients negotiate and then connect
  # in two requests. Keep one replica unless the ingress has sticky sessions.
  replicas: 1
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels:
        app: events
    spec:
      containers:
        - name: events
          image: resgridllc/resgridwebevents:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          env:
            - {name: WAIT_HOSTS, value: "db:5432,redis:6379,rabbitmq:5672"}
            - {name: WAIT_TIMEOUT, value: "600"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/GetCurrent, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
            # Scratch space of the search index (the index itself lives in RustFS).
            - {name: search, mountPath: /data/search}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
        - name: search
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    resgrid.io/tier: app
spec:
  # Keep one worker: it runs the scheduled jobs and the schema migrations.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        # Creates the four Resgrid databases (idempotent) before the worker
        # creates/migrates their schema (RESGRID__DODBUPGRADE=true).
        - name: create-databases
          image: dhi.io/postgres:18-alpine3.22
          command: ["sh", "/scripts/create-databases.sh"]
          env:
            - {name: PGHOST, value: db}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: resgrid-env, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: resgrid-env, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      containers:
        - name: worker
          image: resgridllc/resgridworkersconsole:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          env:
            - {name: WAIT_HOSTS, value: "db:5432,redis:6379,rabbitmq:5672"}
            - {name: WAIT_TIMEOUT, value: "600"}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
            # Scratch space of the search index (the index itself lives in RustFS).
            - {name: search, mountPath: /data/search}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
        - name: search
          emptyDir: {}
        - name: scripts
          configMap: {name: resgrid-database-scripts}
---
apiVersion: v1
kind: Service
metadata:
  name: tts
spec:
  selector:
    app: tts
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  labels:
    resgrid.io/tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      containers:
        - name: tts
          image: resgridllc/resgridwebtts:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    resgrid.io/tier: app
spec:
  # The MCP HTTP endpoint is unauthenticated (users log in inside the
  # protocol). It has no Ingress rule; expose it only inside your network.
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: resgridllc/resgridwebmcp:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          env:
            - {name: WAIT_HOSTS, value: "api:8080"}
            - {name: WAIT_TIMEOUT, value: "600"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
