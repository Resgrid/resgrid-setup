apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: rustfs-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set rustfs http://rustfs:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"; do
                echo "waiting for rustfs..."; sleep 2;
              done
              mc mb --ignore-existing rustfs/resgrid-tts
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: resgrid-env
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: resgrid-env
                  key: RUSTFS_SECRET_KEY
