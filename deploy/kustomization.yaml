apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resgrid

resources:
  - base/namespace.yaml
  - base/database-scripts.yaml
  - base/infrastructure.yaml
  - base/apps.yaml
  - base/rustfs-init.yaml
  - base/ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: resgrid-env
    envs:
      - generated/resgrid.env
  - name: resgrid-ingress-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=generated/tls.crt
      - tls.key=generated/tls.key

configMapGenerator:
  - name: resgrid-hosts
    envs:
      - generated/hosts.env

replacements:
  - source:
      kind: ConfigMap
      name: resgrid-hosts
      fieldPath: data.WEB_HOST
    targets:
      - select:
          kind: Ingress
          name: resgrid
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: resgrid-hosts
      fieldPath: data.API_HOST
    targets:
      - select:
          kind: Ingress
          name: resgrid
        fieldPaths:
          - spec.rules.1.host
          - spec.tls.0.hosts.1
  - source:
      kind: ConfigMap
      name: resgrid-hosts
      fieldPath: data.EVENTS_HOST
    targets:
      - select:
          kind: Ingress
          name: resgrid
        fieldPaths:
          - spec.rules.2.host
          - spec.tls.0.hosts.2
  - source:
      kind: ConfigMap
      name: resgrid-hosts
      fieldPath: data.INGRESS_CLASS
    targets:
      - select:
          kind: Ingress
          name: resgrid
        fieldPaths:
          - spec.ingressClassName
