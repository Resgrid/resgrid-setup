# Optional GPS tracker gateway. Enable RESGRID__UnitTrackingConfig__* in
# deploy/generated/resgrid.env, add tracking to RESGRID_OPTIONAL there
# (comma separated), then run ./setup.sh: it applies this file on every run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-gateway
  namespace: resgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracker-gateway
  template:
    metadata:
      labels:
        app: tracker-gateway
    spec:
      # Published Resgrid images are amd64-only today.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: tracker-gateway
          image: resgridllc/resgridtrackergateway:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: {name: resgrid-env}
          env:
            - {name: WAIT_HOSTS, value: "db:5432,redis:6379,rabbitmq:5672"}
            - {name: WAIT_TIMEOUT, value: "600"}
          ports:
            - {name: queclink-tcp, containerPort: 5004, protocol: TCP}
            - {name: queclink-udp, containerPort: 5004, protocol: UDP}
            - {name: gt06-tcp, containerPort: 5023, protocol: TCP}
            - {name: gt06-udp, containerPort: 5023, protocol: UDP}
            - {name: teltonika-tcp, containerPort: 5027, protocol: TCP}
            - {name: teltonika-udp, containerPort: 5027, protocol: UDP}
            - {name: health, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /health/ready, port: health}
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - {name: resgrid-ca, mountPath: /usr/local/share/resgrid-ca, readOnly: true}
      volumes:
        - name: resgrid-ca
          configMap: {name: resgrid-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: tracker-gateway
  namespace: resgrid
spec:
  type: LoadBalancer
  selector:
    app: tracker-gateway
  ports:
    - {name: queclink-tcp, port: 5004, targetPort: 5004, protocol: TCP}
    - {name: queclink-udp, port: 5004, targetPort: 5004, protocol: UDP}
    - {name: gt06-tcp, port: 5023, targetPort: 5023, protocol: TCP}
    - {name: gt06-udp, port: 5023, targetPort: 5023, protocol: UDP}
    - {name: teltonika-tcp, port: 5027, targetPort: 5027, protocol: TCP}
    - {name: teltonika-udp, port: 5027, targetPort: 5027, protocol: UDP}
