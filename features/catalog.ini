# =============================================================================
#  Optional Resgrid features offered by the setup scripts
# =============================================================================
#
# Resgrid ships new modules switched off behind feature flags (database table
# "featureflags"; a self-hosted server has no screen to change them). Each
# [section] below is ONE question in setup, however many flags it covers.
# Setup turns the section's flags on or off for the whole server, writes its
# settings to .env and starts its extra containers.
#
# Maintaining this file:
#   - A new flag for an existing feature: nothing to do when the section uses
#     "category" (setup reads that category's flags from the database);
#     otherwise add the key to "flags".
#   - A flag retired in Resgrid Core: delete it here. Setup skips keys that
#     don't exist in the database, so an older catalog never breaks setup,
#     and a section whose flags are all gone is not offered.
#   - A feature that is now always on: delete its section.
#   - Flags that no section covers are listed by `setup features --all`,
#     so new Core flags can be switched before the catalog knows them.
#
# Keys (title, category, flags, exclude, requires, recommends, profile,
# available and online take one line; the others can repeat):
#   title       name shown in setup
#   about       description line(s)
#   category    include every flag of this database category
#   flags       flag keys (space separated)
#   exclude     flag keys this section never touches
#   requires    sections switched on together with this one
#   recommends  sections suggested (default yes) when this one is switched on
#   setting     KEY=VALUE written to .env when on; {KEY} is replaced with
#               that key's current .env value
#   off         KEY=VALUE written to .env when switched off
#   ask         KEY|question|default    asked when switching on; Enter keeps
#               the current value
#   profile     Docker Compose profile started with the feature
#   available   no = needs a Resgrid-hosted subscription add-on; listed only
#   online      yes = needs internet access while in use

[records]
title=Records (RMS)
about=Incident and field records (replaces Logs), records in the Responder, Unit and Dispatch apps,
about=prevention (occupancy, inspections, hydrants, permits, community risk reduction),
about=investigations, quality review and records analytics.
about=After switching it on, a department administrator activates Records in the department settings.
category=Records
recommends=search

[search]
title=Unified search
about=Search across calls, personnel, units, contacts and records, plus the command palette.
about=Uses Resgrid's built-in search index, stored in the RustFS object store.
flags=Search.Unified
setting=RESGRID__SearchConfig__Enabled=true
setting=RESGRID__SearchConfig__S3Endpoint={RESGRID__TtsConfig__S3Endpoint}
setting=RESGRID__SearchConfig__S3AccessKey={RUSTFS_ACCESS_KEY}
setting=RESGRID__SearchConfig__S3SecretKey={RUSTFS_SECRET_KEY}
setting=RESGRID__SearchConfig__S3Bucket=resgrid-search
setting=RESGRID__SearchConfig__S3UseSsl=false
setting=RESGRID__SearchConfig__S3ForcePathStyle=true
off=RESGRID__SearchConfig__Enabled=false

[chat]
title=Chat
about=Department chat channels, direct messages and incident chat in the web app and the
about=Responder and Unit apps.
flags=Chat.System

[runcards]
title=Run cards
about=Run cards, station-based dispatching, closest-unit response and move-up recommendations,
about=including conditional run cards (decision graphs, response packages, template gallery).
category=Dispatch
exclude=Dispatch.AiTemplate

[checklists]
title=Checklists
about=Checklists for units, stations and inventory, completed in the web app and the mobile apps.
flags=Checklists.System

[deployments]
title=Deployments
about=Out-of-area deployments: rosters, daily time reports, expenses and attachments.
flags=Operations.Deployments

[setup-wizard]
title=Setup wizard and admin guidance
about=Guided department setup, the setup report and administrator recommendations.
flags=Admin.Setup Admin.Assist

[import]
title=Department import and migration
about=Import personnel, units, stations, contacts, inventory, history and records from
about=spreadsheets and other CAD/RMS systems.
category=Onboarding
exclude=Onboarding.ManagedMigration
recommends=scanning

[scanning]
title=Attachment virus scanning (ClamAV)
about=Scans uploaded files with ClamAV, in an extra container that needs about 1.5 GB of RAM.
about=Department import only accepts .xlsx, .zip, .kml, .kmz and .gpx files when this is on.
profile=clamav
setting=RESGRID__AttachmentScanningConfig__Enabled=true
off=RESGRID__AttachmentScanningConfig__Enabled=false

[twilio-text]
title=Text-message commands through the chatbot (Twilio)
about=Routes inbound SMS through the Resgrid chatbot. Needs a Twilio account and a public API URL.
online=yes
flags=Chatbot.TwilioTextIntegration
ask=RESGRID__NumberProviderConfig__TwilioAccountSid|Twilio account SID|
ask=RESGRID__NumberProviderConfig__TwilioAuthToken|Twilio auth token|
ask=RESGRID__NumberProviderConfig__TwilioResgridNumber|Twilio phone number (e.g. +15551234567)|

# --- Need a Resgrid-hosted subscription add-on (not usable self-hosted) ------

[ai]
title=Enhanced AI
category=AI
flags=Ai.AdminAssist
available=no

[business]
title=Workforce and Business Operations
category=Business
exclude=Operations.Deployments
available=no

[incident-back-office]
title=Incident Back Office
category=Incident
available=no

[readiness-pro]
title=Maintenance and work orders (Readiness Pro)
flags=Maintenance.WorkOrders
available=no

[data-protection]
title=Advanced Data Protection
flags=Security.DepartmentProtectedDataEnrollment
available=no

[operator]
title=Resgrid-operated services (managed migration, Stripe Connect payments)
flags=Onboarding.ManagedMigration Payments.StripeConnect
available=no
