services:
  db:
    image: "dhi.io/postgres:18-alpine3.22"
    env_file:
      - ../.env
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ../docker-data/postgres:/var/lib/postgresql/data/
      - ./db/create-databases.sh:/create-databases.sh:ro
      - ./db/custom-entrypoint.sh:/custom-entrypoint.sh:ro
    command: >
      sh -c "
        cp /custom-entrypoint.sh /tmp/custom-entrypoint.sh &&
        cp /create-databases.sh /tmp/create-databases.sh &&
        chmod +x /tmp/custom-entrypoint.sh /tmp/create-databases.sh &&
        /tmp/custom-entrypoint.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 12
