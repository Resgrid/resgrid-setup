services:
  web:
    image: "resgridllc/resgridwebcore:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports: ["127.0.0.1:5151:80"]
    depends_on: [api, events, worker]
    environment:
      WAIT_HOSTS: "${RICK_DATABASE_HOST}:5432,${RICK_INFRA_HOST}:6379,${RICK_INFRA_HOST}:5672,api:80"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  api:
    image: "resgridllc/resgridwebservices:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports: ["127.0.0.1:5152:80"]
    depends_on: [events, worker]
    environment:
      WAIT_HOSTS: "${RICK_DATABASE_HOST}:5432,${RICK_INFRA_HOST}:6379,${RICK_INFRA_HOST}:5672,events:80"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  events:
    image: "resgridllc/resgridwebevents:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports: ["127.0.0.1:5153:80"]
    environment:
      WAIT_HOSTS: "${RICK_DATABASE_HOST}:5432,${RICK_INFRA_HOST}:6379,${RICK_INFRA_HOST}:5672"
      WAIT_AFTER: "120"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  worker:
    image: "resgridllc/resgridworkersconsole:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    environment:
      WAIT_HOSTS: "${RICK_DATABASE_HOST}:5432,${RICK_INFRA_HOST}:6379,${RICK_INFRA_HOST}:5672"
      WAIT_AFTER: "90"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  tts:
    image: "resgridllc/resgridwebtts:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports: ["127.0.0.1:5154:8080"]
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      WAIT_HOSTS: "${RICK_INFRA_HOST}:6379,${RICK_INFRA_HOST}:9000"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  mcp:
    image: "resgridllc/resgridwebmcp:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports: ["127.0.0.1:5155:8080"]
    depends_on: [api]
    environment:
      WAIT_HOSTS: "api:80"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  tracker-gateway:
    profiles: ["tracking"]
    image: "resgridllc/resgridtrackergateway:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports:
      - "5004:5004/tcp"
      - "5004:5004/udp"
      - "5023:5023/tcp"
      - "5023:5023/udp"
      - "5027:5027/tcp"
      - "5027:5027/udp"
    environment:
      WAIT_HOSTS: "${RICK_DATABASE_HOST}:5432,${RICK_INFRA_HOST}:6379,${RICK_INFRA_HOST}:5672"
      WAIT_TIMEOUT: "300"
    networks: [rick-app]

  relay:
    profiles: ["relay"]
    image: "resgridllc/resgridrelay:latest"
    platform: ${RESGRID_APP_PLATFORM:-linux/amd64}
    env_file: [../.env]
    restart: always
    ports: ["25:2525"]
    depends_on: [api]
    environment:
      WAIT_HOSTS: "api:80"
      WAIT_TIMEOUT: "300"
    volumes:
      - relay-data:/app/publish/data
    networks: [rick-app]

  caddy:
    image: "dhi.io/caddy:2.11.3-debian13"
    env_file: [../.env]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on: [web, api, events, tts]
    volumes:
      - ../docker-data/caddy/data:/data
      - ../docker-data/caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [rick-app]

volumes:
  relay-data:

networks:
  rick-app:
    ipam:
      config:
        - subnet: 172.16.194.0/24
